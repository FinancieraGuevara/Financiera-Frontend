<div class="login-container container-fluid d-flex justify-content-center align-items-center row m-0 p-0">
    <div class="col-md-3 bg-light rounded-4 pb-3">
        <div class="imgcontainer text-center">
          <img src="https://i.imgur.com/nQrwesi.png"/>
        </div>
        <div class="card-body row p-1 me-4 ms-4">

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <input type="text" class="form-control" formControlName="username" placeholder="Ingrese su nombre de usuario">
                <div class="alert alert-danger mt-2" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
                    <span *ngIf="loginForm.get('username')?.errors?.['required']">
                        El nombre de usuario es obligatorio.
                    </span>
                </div>
            </div>
            <div class="form-group mt-3">
                <input type="password" class="form-control" formControlName="password" placeholder="Ingrese su contraseña">
                <div class="alert alert-danger mt-2" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                    <span *ngIf="loginForm.get('password')?.errors?.['required']">
                        La contraseña es obligatoria.
                    </span>
                    <span *ngIf="loginForm.get('password')?.errors?.['minlength']">
                        Su contraseña no puede ser menor a 8 caracteres.
                    </span>
                </div>
            </div>
            <button type="submit" class="btn btn-outline-dark mt-2" [disabled]="loginForm.invalid">Iniciar Sesión</button>
        </form>

        </div>
    </div>
    
    <div class="row">
  
      <div  class="col-md-5">
          <div class="line">
              <hr class="border border-light border-1 opacity-100">
          </div>
      </div>
      <div  class="face col-md-2 text-center">
          <p class="fs-1 inso">I N S O</p>
      </div>
      <div  class="col-md-5">
          <div class="line">
              <hr class="border border-light border-1 opacity-100">
          </div>
      </div>
      <p class="text-center text-light fst-italic fw-semibold">Copyright © 2024, All rights reserved.</p>
  </div>
  </div>
